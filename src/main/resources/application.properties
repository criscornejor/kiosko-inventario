spring.application.name=ms_inventario
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/kiosko_inventario
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.resourceserver.jwt.secret-key=${JWT_SECRET:ESTA_ES_UNA_CLAVE_SECRETA_MUY_LARGA_Y_SEGURA_123456_KIOSKO}
app.security.jwt.secret=${JWT_SECRET:${spring.security.oauth2.resourceserver.jwt.secret-key}}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.clients.notificaciones.url=http://localhost:8089
app.alertas.stock.destinatario=