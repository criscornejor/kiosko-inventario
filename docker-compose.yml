services:
  mysql:
    image: mysql:8.4
    container_name: kiosko-mysql
    environment:
      MYSQL_DATABASE: kiosko_inventario
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ms-inventario:
    build: .
    container_name: kiosko-ms-inventario
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/kiosko_inventario
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      JPA_SHOW_SQL: "false"
    ports:
      - "8080:8080"

volumes:
  mysql_data:
